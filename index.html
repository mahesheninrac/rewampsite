<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why People Love Eninrac</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            font-weight: 600;
        }

        .cards-wrapper {
            display: flex;
            gap: 20px;
            height: 500px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card-without {
            width: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-with {
            width: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .cards-wrapper:hover .card-without:not(:hover) {
            width: 30%;
        }

        .cards-wrapper:hover .card-with:not(:hover) {
            width: 30%;
        }

        .cards-wrapper:hover .card-without:hover {
            width: 70%;
        }

        .cards-wrapper:hover .card-with:hover {
            width: 70%;
        }

        .card-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .card-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .card-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            opacity: 1;
            transition: all 0.6s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.1);
        }

        .card-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
            pointer-events: none;
        }

        .card:hover .card-items {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .card:hover .card-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
        }

        .card-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(10px);
        }

        .card-item-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .card-item span {
            font-size: 1rem;
            line-height: 1.4;
        }

        .minimized-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        .card:hover .minimized-content {
            opacity: 0;
            pointer-events: none;
        }

        .expanded-content {
            opacity: 0;
            transition: opacity 0.3s ease 0.2s;
        }

        .card:hover .expanded-content {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .cards-wrapper {
                flex-direction: column;
                height: auto;
            }

            .card {
                width: 100% !important;
                min-height: 400px;
            }

            h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
